appName: checkout-api
appType: app
cluster: kind-prod
envName: proofing
httpRoute:
  enabled: true
  hostnames: ["checkout-api-proofing.prod.kiac.local"]
  parentRefs:
    - name: kiac
      namespace: kiac-gateway
rollout:
  image:
    repository: ghcr.io/jfillman/checkout-api
    tag: 0.5.2-6d1531d
  ports:
    - name: http
      containerPort: 3000
  livenessProbe:
    httpGet:
      path: /healthz
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /healthz
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
  strategy: canary
  # Real progression, not the chart's inert setWeight:100 default: two
  # weight/pause stages gated by an analysis run each (readiness, then
  # restart-stability), then two more weight/pause stages before the full
  # promotion - 8 steps, well past the "at least 4" ask. Both AnalysisTemplates
  # below query kube-state-metrics (already scraped on this cluster) rather than
  # an app-level metric - checkout-api has no /metrics endpoint of its own today
  # (its ServiceMonitor scrapes nothing), so a query against an app metric would
  # never resolve and every canary would analysis-error, not gate on anything
  # real. Pod name matching (pod=~".*-{{args.canary-hash}}-.*") sidesteps that:
  # kube_pod_labels on this cluster carries no label_* dimensions (default empty
  # metric-labels-allowlist, confirmed live), so there's no rollouts-pod-
  # template-hash label to join on - but the hash is already embedded in every
  # pod's own name by the standard Deployment/ReplicaSet naming convention.
  steps:
    - setWeight: 20
    - pause: {duration: 30s}
    - analysis:
        templates:
          - templateName: pod-health-check
        args:
          - name: canary-hash
            valueFrom: {podTemplateHashValue: Latest}
    - setWeight: 40
    - pause: {duration: 30s}
    - analysis:
        templates:
          - templateName: restart-stability-check
        args:
          - name: canary-hash
            valueFrom: {podTemplateHashValue: Latest}
    - setWeight: 60
    - pause: {duration: 30s}
    - setWeight: 80
    - pause: {duration: 30s}
  # Continuous background check, sibling of steps (runs for the whole rollout,
  # not just at the two explicit analysis steps above) - same pod-health
  # template, reused rather than duplicated.
  canaryAnalysis:
    templates:
      - templateName: pod-health-check
    args:
      - name: canary-hash
        valueFrom: {podTemplateHashValue: Latest}
    startingStep: 1
analysisTemplates:
  # Both queries verified live against this cluster's real Prometheus
  # (kube-prometheus-stack-prometheus.observability, port 9090) before being
  # committed here - not guessed against the Argo Rollouts docs' example shape.
  - name: pod-health-check
    args:
      - name: canary-hash
      - name: namespace
        value: app-checkout-api-proofing
    metrics:
      - name: pod-ready-ratio
        interval: 30s
        count: 3
        successCondition: "result[0] >= 0.9"
        failureLimit: 1
        provider:
          prometheus:
            address: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
            query: |
              avg(kube_pod_status_ready{namespace="{{args.namespace}}", pod=~".*-{{args.canary-hash}}-.*", condition="true"})
  - name: restart-stability-check
    args:
      - name: canary-hash
      - name: namespace
        value: app-checkout-api-proofing
    metrics:
      - name: restart-count
        interval: 30s
        count: 3
        successCondition: "result[0] < 3"
        failureLimit: 1
        provider:
          prometheus:
            address: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
            query: |
              sum(kube_pod_container_status_restarts_total{namespace="{{args.namespace}}", pod=~".*-{{args.canary-hash}}-.*", container="checkout-api"})
# First real SLO on this platform (see HANDOFF-tower-slos.md) - deployed to
# get live PrometheusServiceLevel/PrometheusRule data to build the Tower SLOs
# tab against. checkout-api exposes no application-level HTTP metrics of its
# own (ServiceMonitor target confirmed down live: "context deadline exceeded"
# hitting :3000/metrics - it doesn't listen there), so this can't be a real
# request-error-rate SLO yet. Uses kubelet's own prober_probe_duration_seconds
# histogram instead (real, live-verified: le buckets 0.005..10 confirmed
# present for this pod's liveness probe, ~86% of samples already under 5ms) -
# a genuine latency signal for this app's HTTP endpoint (the liveness probe
# hits /healthz over HTTP), not a fabricated metric. Swap to a real
# http_request_duration_seconds-based SLO once checkout-api is actually
# instrumented.
slos:
  - name: checkout-api-liveness-latency
    service: checkout-api
    objective: 99
    indicator:
      type: latency
      metric: prober_probe_duration_seconds
      totalFilter: 'namespace="app-checkout-api-proofing",container="checkout-api",probe_type="Liveness"'
      latencyThreshold: "0.01"
  # Second SLO (2026-09-14), deliberately NOT breaching - a contrast case for
  # Tower's SLOs tab. Same real metric family as the liveness one above
  # (kubelet's prober_probe_duration_seconds), but the readiness probe
  # instead, with a threshold picked from the ACTUAL live bucket
  # distribution rather than a round-number guess: live-checked cumulative
  # buckets for probe_type="Readiness" (total 6534 samples) put 6521 (99.80%)
  # under 1s, comfortably clearing the 99% objective with real margin -
  # unlike the liveness SLO's 10ms threshold, which was picked before
  # checking the real distribution and turned out to be far tighter than
  # this app's actual probe latency (see that SLO's own comment).
  #
  # latencyThreshold: "1.0", not "1" - real bug hit live 2026-09-14: this
  # XRD's own schema explicitly warns latencyThreshold must exactly match
  # the histogram's le bucket label AS PROMETHEUS RENDERS IT, and this
  # histogram's real buckets are 0.005,0.01,...,0.5,1.0,2.5,... (confirmed
  # live) - "1" matches nothing, so the generated errorQuery's
  # le="1"-filtered subtraction silently evaluated to an empty vector, which
  # empty-propagated through the whole ratio and division: every one of
  # Sloth's sli_error/burn-rate/budget recording rules for this SLO came
  # back with zero series, no error anywhere, while the SLO itself still
  # showed Ready/Synced. Not a Composition bug this time - a plain
  # string-match mistake in the SLO's own spec.
  - name: checkout-api-readiness-latency
    service: checkout-api
    objective: 99
    indicator:
      type: latency
      metric: prober_probe_duration_seconds
      totalFilter: 'namespace="app-checkout-api-proofing",container="checkout-api",probe_type="Readiness"'
      latencyThreshold: "1.0"
  # Third SLO (2026-09-14) - a genuinely robust "not breaching" demonstration,
  # after the readiness-latency SLO above turned out to be a bad example of
  # that: its 1.0s threshold was picked from one snapshot of cumulative
  # bucket counts, close enough to the real tail that it flips between
  # comfortably-passing and breaching depending on extrapolation noise from
  # this metric's still-short real history (Sloth's 30d compliance window is
  # a platform-wide, not per-SLO, setting - can't shrink it away). Re-checked
  # live 2026-09-14 and found the bucket counts had already reset (kubelet's
  # own probe-metrics counter isn't a stable lifetime baseline to threshold
  # precisely against), confirming a knife's-edge pick is the wrong strategy
  # here regardless of which snapshot it's picked from.
  #
  # This one uses the SAME liveness probe as checkout-api-liveness-latency
  # above, but a 5-SECOND threshold - two full orders of magnitude above this
  # app's real latency (every measurement across this whole session stayed
  # in the tens-of-milliseconds range). Real margin against noise/
  # extrapolation instead of a threshold picked from one bucket snapshot,
  # the actual lesson from getting this wrong twice already.
  - name: checkout-api-liveness-headroom
    service: checkout-api
    objective: 99
    indicator:
      type: latency
      metric: prober_probe_duration_seconds
      totalFilter: 'namespace="app-checkout-api-proofing",container="checkout-api",probe_type="Liveness"'
      latencyThreshold: "5.0"
releaseTracking:
  relayUrl: "http://dev.kiac.local:30880/outcome/kind-prod"
  relayHostAliasIP: "192.168.64.7"
  cluster: kind-prod
  appNamespace: app-checkout-api-cicd
  gitUrl: https://github.com/jfillman/checkout-api
  gitRevision: "6d1531dde8e21f2b794bf209d128c60cebceca23"
  flowStartTime: "2026-09-17T15:02:17.060823926Z"
  chainId: "628ddba1-9804-42f2-9dd7-9f09b6a75387"
  prUrl: ""
  prCreatedAt: ""
  configJsonB64: 
