appName: checkout-api
appType: app
cluster: kind-prod
envName: prod
rollout:
  image:
    repository: ghcr.io/jfillman/checkout-api
    tag: src-bug-2-ai-triage-test-8859462
  ports:
    - name: http
      containerPort: 3000

configMaps:
  - name: app-settings
    existingConfigMap: checkout-api-app-config
    mountPath: /config/app-settings

notifications:
  slack:
    enabled: true
    channel: "#all-idp-lab"

secrets:
  - name: dummy-secret-01
    as: env
    key: DUMMY_SECRET_01
  - name: dummy-secret-02
    as: volume
    mountPath: /etc/dummy-secret-02
  - name: dummy-secret-03
    as: env
    key: DUMMY_SECRET_03
    shared: true
