appName: checkout-api
appType: app
cluster: kind-prod
envName: prod
rollout:
  image:
    repository: ghcr.io/jfillman/checkout-api
    tag: 0.1.7-71c18cb
  ports:
    - name: http
      containerPort: 3000

secrets:
  - name: dummy-secret-01
    as: env
    key: DUMMY_SECRET_01
  - name: dummy-secret-02
    as: volume
    mountPath: /etc/dummy-secret-02
  - name: dummy-secret-03
    as: env
    key: DUMMY_SECRET_03
    shared: true