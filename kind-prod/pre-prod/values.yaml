appName: checkout-api
appType: app
cluster: kind-prod
envName: pre-prod
httpRoute:
  enabled: true
  hostnames: [ "checkout-api-pre-prod.prod.kiac.local" ]
  parentRefs:
    - name: kiac
      namespace: kiac-gateway
rollout:
  strategy: canary
  canaryAnalysis:
    templates:
      - templateName: pod-health-check
    args:
      - name: canary-hash
        valueFrom:
          podTemplateHashValue: Latest
    startingStep: 1
  replicas: 2
  ports:
    - name: http
      containerPort: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128M
    limits: {}
  steps:
    - setWeight: 20
    - pause:
        duration: 30s
    - analysis:
        templates:
          - templateName: pod-health-check
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
    - setWeight: 40
    - pause:
        duration: 30s
    - analysis:
        templates:
          - templateName: restart-stability-check
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
    - setWeight: 60
    - pause:
        duration: 30s
    - setWeight: 80
    - pause:
        duration: 30s
  livenessProbe:
    httpGet:
      path: /healthz
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /healthz
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
analysisTemplates:
  # Both queries verified live against this cluster's real Prometheus
  # (kube-prometheus-stack-prometheus.observability, port 9090) before being
  # committed here - not guessed against the Argo Rollouts docs' example shape.
  - name: pod-health-check
    args:
      - name: canary-hash
      - name: namespace
        value: app-checkout-api-pre-prod
    metrics:
      - name: pod-ready-ratio
        interval: 30s
        count: 3
        successCondition: "result[0] >= 0.9"
        failureLimit: 1
        provider:
          prometheus:
            address: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
            query: |
              avg(kube_pod_status_ready{namespace="{{args.namespace}}", pod=~".*-{{args.canary-hash}}-.*", condition="true"})
  - name: restart-stability-check
    args:
      - name: canary-hash
      - name: namespace
        value: app-checkout-api-pre-prod
    metrics:
      - name: restart-count
        interval: 30s
        count: 3
        successCondition: "result[0] < 3"
        failureLimit: 1
        provider:
          prometheus:
            address: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
            query: |
              sum(kube_pod_container_status_restarts_total{namespace="{{args.namespace}}", pod=~".*-{{args.canary-hash}}-.*", container="checkout-api"})
releaseTracking:
  relayUrl: "http://dev.kiac.local:30880/outcome/kind-prod"
  relayHostAliasIP: 192.168.64.7
  cluster: kind-prod
  appNamespace: app-checkout-api-cicd
  gitUrl: https://github.com/jfillman/checkout-api
  gitRevision: 6d1531dde8e21f2b794bf209d128c60cebceca23
  flowStartTime: "2026-09-18T02:38:52.562Z"
  chainId: "427bfdac-ef72-428d-b8c2-c72b14e29944"
  prUrl: https://github.com/jfillman/gitops-checkout-api/pull/40
  prCreatedAt: "2026-09-01T06:44:35.799003503Z"
  configJsonB64: 
